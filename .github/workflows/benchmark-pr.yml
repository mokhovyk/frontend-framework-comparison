name: Benchmark (PR)

# Measures the PR's base and head on the same runner, one after the other, and
# compares them with a Mann-Whitney U test. Comparing against a baseline from a
# different machine/run is dominated by runner-to-runner noise.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BENCH_ENV: >-
    -e BENCHMARK_REDUCED=true
    -e BENCHMARK_ROUNDS=1
    -e BENCHMARK_FAIL_ON_VARIANCE=false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: base
          file: base/docker/Dockerfile
          tags: bench:base
          load: true
          cache-from: |
            type=gha,scope=bench-pr-base
            type=gha,scope=bench-main
          cache-to: type=gha,scope=bench-pr-base,mode=max

      - name: Build head image
        uses: docker/build-push-action@v6
        with:
          context: head
          file: head/docker/Dockerfile
          tags: bench:head
          load: true
          cache-from: |
            type=gha,scope=bench-pr-head
            type=gha,scope=bench-main
          cache-to: type=gha,scope=bench-pr-head,mode=max

      - name: Run base (reduced)
        continue-on-error: true
        run: |
          docker run --cpus=2 --memory=4g $BENCH_ENV \
            -e GIT_COMMIT=${{ github.event.pull_request.base.sha }} \
            -v ${{ github.workspace }}/results-base:/app/results \
            bench:base

      - name: Run head (reduced)
        run: |
          docker run --cpus=2 --memory=4g $BENCH_ENV \
            -e GIT_COMMIT=${{ github.event.pull_request.head.sha }} \
            -v ${{ github.workspace }}/results-head:/app/results \
            bench:head

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: head/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: head/.nvmrc
          cache: pnpm
          cache-dependency-path: head/pnpm-lock.yaml

      - name: Build comparison tool
        working-directory: head
        run: |
          pnpm install --frozen-lockfile --filter bench-harness
          pnpm --filter bench-harness build

      - name: Detect harness changes
        id: harness
        run: |
          if diff -rq base/packages/bench-harness/src head/packages/bench-harness/src > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate comparison comment
        run: |
          sudo chown -R "$(id -u):$(id -g)" results-base results-head 2>/dev/null || true
          if [ ! -f results-base/latest.json ]; then
            mkdir -p results-base
            echo '{"meta":{"commit":"none","chromeVersion":"","timestamp":""},"results":{}}' > results-base/latest.json
          fi
          node head/packages/bench-harness/dist/compare-cli.js \
            results-base/latest.json results-head/latest.json \
            --markdown pr-comment.md --no-fail \
            ${{ steps.harness.outputs.changed == 'true' && '--advisory' || '' }}

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: pr-comment.md

      # A PR that changes the harness measures base and head with different
      # code, so its "regressions" aren't comparable — the gate is skipped.
      - name: Check for regressions
        if: steps.harness.outputs.changed == 'false'
        run: |
          node head/packages/bench-harness/dist/compare-cli.js \
            results-base/latest.json results-head/latest.json
