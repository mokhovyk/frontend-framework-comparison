name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Builds every package and app (tsc / ng build type-check as they go)
      - name: Build all
        run: pnpm build:all

      - name: Type-check React and Vue apps
        run: pnpm typecheck

      - name: Harness unit tests
        run: pnpm test:unit

      - name: Install Playwright Chromium
        run: pnpm --filter parity-tests exec playwright install --with-deps chromium

      - name: Parity tests
        run: pnpm test:parity
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/parity-tests/playwright-report
          retention-days: 7
