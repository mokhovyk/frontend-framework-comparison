name: Benchmark (Weekly)

# Picks up new minor/patch releases of the frameworks and Playwright (Chromium),
# verifies them like any PR, then benchmarks the commit that contains them.
# Major versions come in as Dependabot PRs instead (see .github/dependabot.yml),
# since they can need code migrations.

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6am UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-weekly
  cancel-in-progress: false

jobs:
  update-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Updates within the ranges in package.json. Angular packages are
      # updated together because they peer-depend on each other's exact version.
      - name: Update framework versions
        run: |
          pnpm --filter react-benchmarks update react react-dom react-router react-router-dom
          pnpm --filter angular-benchmarks update "@angular/*" "@angular-devkit/*"
          pnpm --filter framework-vue update vue vue-router
          pnpm --filter bench-harness update playwright
          pnpm --filter parity-tests update @playwright/test

      - name: Install dependencies
        run: pnpm install

      - uses: ./.github/actions/verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/parity-tests/playwright-report
          retention-days: 7

      # Playwright's Chromium and its system libraries are installed in the
      # image, so a new version can break the image even when tests pass.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          cache-from: type=gha,scope=bench-main
          cache-to: type=gha,scope=bench-main,mode=max

      - name: Commit version updates
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml frameworks/*/package.json packages/*/package.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(deps): update framework versions"
            git pull --rebase origin main
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: update-deps
    uses: ./.github/workflows/benchmark-publish.yml
    permissions:
      contents: write
    with:
      ref: ${{ needs.update-deps.outputs.sha }}
      commit-message: 'chore: weekly benchmark run with latest framework versions'
