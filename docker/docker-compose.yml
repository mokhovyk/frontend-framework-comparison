services:
  benchmark:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    cpus: 2
    mem_limit: 4g
    volumes:
      - ../results:/app/results
    environment:
      - NODE_ENV=production
      # Recorded in results meta; e.g. GIT_COMMIT=$(git rev-parse HEAD) docker compose ...
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BENCHMARK_RUNS=25
      - BENCHMARK_WARMUP=5
    command: ["pnpm", "run", "benchmark"]

  benchmark-reduced:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    cpus: 2
    mem_limit: 4g
    volumes:
      - ../results:/app/results
    environment:
      - NODE_ENV=production
      # Recorded in results meta; e.g. GIT_COMMIT=$(git rev-parse HEAD) docker compose ...
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BENCHMARK_RUNS=10
      - BENCHMARK_WARMUP=3
      - BENCHMARK_REDUCED=true
    command: ["pnpm", "run", "benchmark"]
